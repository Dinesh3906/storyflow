version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: storyflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: storyflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: storyflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: storyflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: storyflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/storyflow
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET: storyflow-production-jwt-signing-secret-key-32chars
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadminpassword
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.realtime
    container_name: storyflow-realtime
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REALTIME_PORT: 8080
      AUTH_SECRET: storyflow-production-jwt-signing-secret-key-32chars
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      API_BASE_URL: http://api:8000
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: storyflow-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    depends_on:
      - api
      - realtime

volumes:
  postgres_data:
  redis_data:
  minio_data:
