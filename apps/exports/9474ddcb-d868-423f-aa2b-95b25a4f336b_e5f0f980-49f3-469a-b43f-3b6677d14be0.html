<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Afraid Nurse</title>
<style>
  @page {
    size: A4;
    margin: 2.5cm 2cm 2.5cm 2cm;
    @bottom-center {
      content: counter(page);
      font-size: 10pt;
      color: #666;
    }
  }
  body {
    font-family: Georgia, 'Times New Roman', Cambria, serif;
    font-size: 12pt;
    line-height: 1.5;
    color: #1a1a1a;
    background-color: #ffffff;
    margin: 0;
    padding: 0;
  }
  .title-page {
    page-break-after: always;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    text-align: center;
  }
  .story-title {
    font-size: 28pt;
    font-weight: 700;
    margin-bottom: 1rem;
    letter-spacing: -0.02em;
  }
  .story-author {
    font-size: 14pt;
    color: #555555;
    margin-bottom: 2rem;
  }
  .story-meta {
    font-size: 10pt;
    color: #888888;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .content {
    white-space: pre-wrap;
    text-align: justify;
    text-justify: inter-word;
  }
  /* Screenplay formatting */
  .screenplay {
    font-family: 'Courier New', Courier, monospace;
    font-size: 12pt;
    line-height: 1.2;
    text-align: left;
    max-width: 6.0in;
    margin: 0 auto;
  }
  /* Poetry formatting */
  .poetry {
    font-style: italic;
    line-height: 1.8;
    text-align: left;
    margin-left: 2cm;
  }
</style>
</head>
<body>
  
  <div class="title-page">
    <h1 class="story-title">The Afraid Nurse</h1>
    <p class="story-author">by Antigravity Novelist</p>
    <p class="story-meta">NARRATIVE &bull; TE &bull; September 27, 2026</p>
  </div>

  <main class="content ">
A roju nenu hospital ki vellanu. Akkada oka nurse undi.
  </main>
</body>
</html>
